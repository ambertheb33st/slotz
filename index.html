<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pacaneaua anului (roby bet)</title>
<style>
body {
  font-family: Arial; text-align: center; background:#021d02; color:white; margin:0; padding:0; display:flex; justify-content:center; position: relative;
}
.container {
  margin-top:20px; padding:15px; position: relative; max-width:400px;
  background: linear-gradient(145deg,#003300,#005500);
  border-radius:20px;
  box-shadow: 0 0 40px gold, 0 0 80px #00ff00 inset;
}

/* SHINY TITLE */
h1 {
  font-size:28px;
  background: linear-gradient(45deg, gold, #00ff00, orange, yellow);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shineTitle 2s infinite alternate;
  text-shadow: 0 0 5px gold, 0 0 10px #00ff00, 0 0 15px orange;
}
@keyframes shineTitle {
  0% { text-shadow:0 0 10px gold,0 0 20px #00ff00,0 0 30px orange; transform:scale(1); }
  50% { text-shadow:0 0 25px gold,0 0 40px #00ff00,0 0 50px orange; transform:scale(1.05); }
  100% { text-shadow:0 0 10px gold,0 0 20px #00ff00,0 0 30px orange; transform:scale(1); }
}

/* SPIN BUTTON */
.spinBtn {
  width:90px; height:90px; font-size:36px; border-radius:50%; border:none;
  background:linear-gradient(45deg, gold, orange); font-weight:bold; cursor:pointer;
  box-shadow:0 0 30px gold,0 0 60px orange; animation:pulseSpin 1s infinite alternate;
  display:block; margin:20px auto; transition: transform 0.2s;
}
.spinBtn:hover { transform: scale(1.1); }
@keyframes pulseSpin { from {box-shadow:0 0 10px gold;} to {box-shadow:0 0 40px gold,0 0 80px orange;} }

/* INPUT */
input {
  padding:10px; width:90px; text-align:center; font-size:16px; margin:5px 0;
  border-radius:8px; border:none; font-weight:bold;
  background: linear-gradient(135deg, #001100, #00ff00);
  color: gold;
  text-shadow: 1px 1px 2px black;
  box-shadow:0 0 10px #00ff00 inset, 0 0 20px #00ff00;
}
.shinyDollar {
  font-size:28px; color: gold; text-shadow:0 0 20px gold,0 0 40px yellow; margin-bottom: -5px;
}

/* GRID AND REELS */
.grid {
  display:grid; grid-template-columns: repeat(5, 70px); grid-template-rows: repeat(4, 70px); gap:6px; justify-content:center; margin:15px auto;
  padding:10px; background:rgba(0,0,0,0.25); border-radius:15px;
  box-shadow: 0 0 20px gold inset, 0 0 40px #00ff00 inset;
}
.reel {
  width:70px; height:70px;
  background:linear-gradient(145deg, #001100, #002200);
  border-radius:12px; display:flex; align-items:center; justify-content:center;
  font-size:68px;
  color:white; 
  text-shadow: 0 0 2px black, 0 0 6px #fff, 0 0 12px gold, 0 0 20px #00ff00;
  transition: transform 0.2s, box-shadow 0.3s;
}
.reel.bonus { box-shadow:0 0 25px purple,0 0 50px magenta inset; }
.reelSymbol { 
  -webkit-text-stroke: 1.5px white;
  text-shadow: 0 0 3px #000, 0 0 5px gold, 0 0 10px #00ff00;
}

/* Spin animation only applied while spinning */
.spin { animation:spin 0.15s linear infinite; }
@keyframes spin { 0%{transform:translateY(0px);}50%{transform:translateY(2px);}100%{transform:translateY(0px);} }

/* RESULT AND FLASH */
.result { font-size:22px; margin-top:10px; font-weight:bold; }
.flash { animation:flash .3s infinite alternate; }
@keyframes flash { from{background:gold;color:black;} to{background:red;color:white;} }

/* COINS AND BIGWIN */
.coin { position:fixed; font-size:28px; animation:coinFly 1s ease-out forwards; text-shadow: 1px 1px 3px gold; }
@keyframes coinFly {0%{transform:translateY(0) scale(1);opacity:1;}100%{transform:translateY(-200px) scale(0.5);opacity:0;}}
.bigwin { position:fixed; top:35%; left:50%; transform:translate(-50%,-50%); font-size:42px; color:gold; text-shadow:0 0 25px gold,0 0 50px orange; animation:pop 0.5s ease; }
@keyframes pop {0%{transform:translate(-50%,-50%) scale(0.5);} 100%{transform:translate(-50%,-50%) scale(1);}}
.shake { animation:shake 0.3s; }
@keyframes shake {0%{transform:translate(1px,1px);}50%{transform:translate(-1px,-1px);}100%{transform:translate(0,0);}}

.decorativeDollar {
  position:fixed; color: rgba(255,255,255,0.1); font-size:16px;
  font-weight:bold; pointer-events:none; user-select:none;
}
</style>
</head>
<body>
<div class="container" id="container">
<h1>Pacaneaua anului (roby bet)</h1>
<div class="shinyDollar">$</div>
<p>Valoare: $<span id="balance">1000</span></p>
<input type="number" id="bet" value="50"><br>
<button onclick="adjustBet(-10)">-</button>
<button onclick="adjustBet(10)">+</button>

<div id="grid" class="grid"></div>

<button class="spinBtn" onclick="startSpin()">♻️</button>
<div class="result" id="result">Apasa SPIN</div>
</div>

<script>
let balance=1000;
let spinCount=0;
let consecutiveWins = 0;
const symbols=["🍒","🍋","🔔","⭐","💎"];
const rollingSound = new Audio("https://freesound.org/data/previews/341/341695_5260877-lq.mp3");
rollingSound.preload = "auto";
const winSound = new Audio("https://freesound.org/data/previews/341/341695_5260877-lq.mp3");
const bonusSound = new Audio("https://actions.google.com/sounds/v1/cash/register_open.ogg");
const tickSound = new Audio("https://actions.google.com/sounds/v1/mechanical/metal_twang.ogg");

const gridEl=document.getElementById("grid");
let cells=[];
function init(){
  gridEl.innerHTML="";
  cells=[];
  for(let i=0;i<20;i++){
    let d=document.createElement("div");
    d.className="reel";
    let symbol = document.createElement("span");
    symbol.className="reelSymbol";
    symbol.innerText = symbols[Math.floor(Math.random()*symbols.length)];
    d.appendChild(symbol);
    gridEl.appendChild(d);
    cells.push(d);
  }
  
  // decorative $ symbols
  for(let i=0;i<15;i++){
    let dollar = document.createElement("div");
    dollar.className = "decorativeDollar";
    dollar.innerText = "$";
    dollar.style.left = Math.random()*window.innerWidth + "px";
    dollar.style.top = Math.random()*window.innerHeight + "px";
    dollar.style.fontSize = (8 + Math.random()*12) + "px";
    document.body.appendChild(dollar);
  }
}

function randSymbol(){ return symbols[Math.floor(Math.random()*symbols.length)]; }
function adjustBet(a){ let el=document.getElementById("bet"); let v=parseInt(el.value)+a; if(v>0) el.value=v; }

function spawnCoins(){ for(let i=0;i<20;i++){ let coin=document.createElement("div"); coin.className="coin"; coin.innerText="💰"; coin.style.left=Math.random()*window.innerWidth+"px"; coin.style.top=(window.innerHeight-50)+"px"; document.body.appendChild(coin); setTimeout(()=>coin.remove(),1000);} }

function bigWinText(){ let t=document.createElement("div"); t.className="bigwin"; t.innerText="TE UMPLI DE BANI"; document.body.appendChild(t); setTimeout(()=>t.remove(),1000); }

function nearWin(row){ 
  let symbolsInRow = cells.slice(row*5,row*5+5).map(c=>c.firstChild);
  let target=symbolsInRow[0].innerText;
  for(let i=1;i<5;i++){ if(Math.random()<0.5) symbolsInRow[i].innerText=target; }
}

function startSpin(){ rollingSound.currentTime=0; rollingSound.play().catch(e=>console.log("Rolling sound blocked:",e)); spin(); }

function spin(){
 let bet=parseInt(document.getElementById("bet").value);
 let result=document.getElementById("result");
 let container=document.getElementById("container");
 if(bet>balance){ result.innerText="Nu ai suficienti bani"; return; }
 spinCount++; result.innerText="Se roteste..."; result.classList.remove("flash"); 

 // add spin class only while spinning
 cells.forEach(c=>c.classList.add("spin"));

 // Smooth staggered spin for each reel
 let durations = Array.from({length:20}, (_,i) => 800 + i*40);
 cells.forEach((c,i) => {
   let interval = setInterval(()=>{ c.firstChild.innerText = randSymbol(); }, 60);
   setTimeout(()=>{ 
     clearInterval(interval); 
     c.classList.remove("spin"); // remove spin when finished
   }, durations[i]);
 });

 setTimeout(()=>{
  // Bonus symbol
  if(spinCount%3===0){ 
    let i=Math.floor(Math.random()*20); 
    cells[i].firstChild.innerText="💰"; 
    cells[i].classList.add("bonus"); 
    bonusSound.play(); 
  }
  if(Math.random()<0.25){ let r=Math.floor(Math.random()*4); nearWin(r); }

  let win=0;
  for(let r=0;r<4;r++){
    let row=cells.slice(r*5,r*5+5).map(c=>c.firstChild.innerText); 
    let counts={}; row.forEach(s=>counts[s]=(counts[s]||0)+1); 
    let max=Math.max(...Object.values(counts)); if(max>=5) win+=bet*max;
  }

  if(win>0){
    balance+=win;
    consecutiveWins++;
    let winMessage = (consecutiveWins>=2) ? "TE UMPLI DE BANI" : "AI CASTIGAT! :)";
    result.innerText=winMessage + " $" + win;
    result.classList.add("flash");
    winSound.currentTime=0; winSound.play(); 
    spawnCoins(); container.classList.add("shake"); 
    if(win>bet*5) bigWinText(); 
    setTimeout(()=>container.classList.remove("shake"),400);
  } else { 
    balance-=bet; 
    result.innerText="AI PIERDUT! :("; 
    consecutiveWins=0;
  }
  tickSound.play(); 
  document.getElementById("balance").innerText=balance;
 },1200);
}

init();
</script>
</body>
</html>
